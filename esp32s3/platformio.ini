; ESP32-S3 Enhanced checkm8 PlatformIO Configuration
; Dual USB-C support with automation features

[env:esp32s3]
platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; Build configuration
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DCONFIG_TINYUSB_HID_ENABLED=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_MIDI_ENABLED=0
    -DCONFIG_TINYUSB_DFU_RT_ENABLED=1
    -DCORE_DEBUG_LEVEL=3
    -DA5_8942
    -DWIFI_MODE_AP
    -DCHECKM8_ESP32S3_VERSION="1.0.0"

; Memory configuration
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Upload configuration
upload_speed = 921600
upload_port = /dev/ttyUSB0
upload_protocol = esptool

; Monitor configuration
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time
    log2file

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/espressif/arduino-esp32.git#2.0.11

; Extra scripts for automation
extra_scripts = 
    pre:tools/pre_build.py
    post:tools/post_build.py

; Custom build targets
targets = 
    checkm8_esp32s3

[env:esp32s3_debug]
extends = env:esp32s3
build_type = debug
build_flags = 
    ${env:esp32s3.build_flags}
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_WIFI
    -DDEBUG_ESP_HTTP_SERVER
    -O0
    -g3

[env:esp32s3_release]
extends = env:esp32s3
build_type = release
build_flags = 
    ${env:esp32s3.build_flags}
    -O2
    -DNDEBUG
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections